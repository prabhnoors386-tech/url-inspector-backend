<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Inspector | Fraud Guard AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!-- External Header and Footer components -->
    <script src="../components/Navbar.js" defer></script>
    <script src="../components/Footer.js" defer></script>
  </head>
  <body class="bg-[#F6F4EE] font-sans text-[#1F2421] antialiased">
    <div id="site-navbar"></div>

    <main class="w-full pt-24 pb-12 min-h-screen">
      <div class="w-full max-w-3xl mx-auto px-4 sm:px-6">
        <!-- Header -->
        <div class="text-center mb-12 flex flex-col gap-4">
          <div
            class="inline-flex items-center justify-center gap-2 text-[#2D5A43] bg-[#2D5A43]/10 px-4 py-2 rounded-full font-bold text-sm mx-auto"
          >
            <span class="material-symbols-outlined text-[18px]"
              >verified_user</span
            >
            Domain Age & Risk Analysis
          </div>
          <h1
            class="text-4xl sm:text-5xl font-extrabold text-[#1F2421] tracking-tight"
          >
            URL Inspector
          </h1>
          <p class="text-lg text-[#525B57]">
            Check when a website was actually created. Scammers often use brand
            new domains to trick you.
          </p>
        </div>

        <!-- Search Box -->
        <div
          class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-200 mb-8 border-dashed border-2 hover:bg-[#F9F8F5] transition-colors"
        >
          <label class="block text-sm font-semibold text-gray-700 mb-3"
            >Paste suspicious link here</label
          >
          <div class="flex flex-col sm:flex-row gap-4">
            <input
              type="text"
              id="urlInput"
              placeholder="e.g., https://secure-update-banking.com"
              class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#2D5A43] focus:border-[#2D5A43] outline-none transition-all"
            />
            <button
              id="scanBtn"
              class="bg-[#113222] text-white px-8 py-3 rounded-xl font-semibold hover:bg-[#1a4a33] transition-colors inline-flex items-center justify-center gap-2 shadow-md"
            >
              <span class="material-symbols-outlined">radar</span>
              Inspect
            </button>
          </div>
        </div>

        <!-- Loading State -->
        <div id="loadingBox" class="hidden text-center py-8">
          <div
            class="inline-flex items-center gap-3 text-[#2D5A43] font-semibold text-lg animate-pulse"
          >
            <span class="material-symbols-outlined animate-spin text-2xl"
              >progress_activity</span
            >
            Querying WHOIS Database...
          </div>
        </div>

        <!-- Results Card -->
        <div
          id="resultBox"
          class="hidden bg-white rounded-2xl shadow-sm border p-6 sm:p-8"
        >
          <div
            class="flex flex-col sm:flex-row items-start gap-4 mb-6 pb-6 border-b border-gray-100"
          >
            <span
              id="statusIcon"
              class="material-symbols-outlined text-4xl shrink-0 mt-1"
            ></span>
            <div>
              <h3 id="statusTitle" class="text-2xl font-bold mb-2"></h3>
              <p id="statusSubtitle" class="text-sm leading-relaxed"></p>
            </div>
          </div>

          <div class="space-y-6">
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
              <p
                class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
              >
                Target Domain
              </p>
              <p
                id="resDomain"
                class="text-lg font-bold text-gray-900 font-mono break-all"
              ></p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                <p
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
                >
                  Creation Date
                </p>
                <p id="resDate" class="text-lg font-medium text-gray-900"></p>
              </div>
              <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                <p
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1"
                >
                  Domain Age
                </p>
                <p id="resAge" class="text-lg font-medium text-gray-900"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script>
      document.getElementById('scanBtn').addEventListener('click', async () => {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return alert('Please enter a valid URL');

        const resultBox = document.getElementById('resultBox');
        const loadingBox = document.getElementById('loadingBox');

        resultBox.classList.add('hidden');
        loadingBox.classList.remove('hidden');

        try {
          // Change this URL to your live Render API when you deploy
          const response = await fetch(
            'http://localhost:3000/api/inspect-url',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url }),
            }
          );

          const json = await response.json();

          if (json.error) {
            alert(json.error);
            loadingBox.classList.add('hidden');
            return;
          }

          const data = json.data;

          loadingBox.classList.add('hidden');
          resultBox.classList.remove(
            'hidden',
            'border-rose-200',
            'border-emerald-200'
          );

          document.getElementById('resDomain').textContent = data.domain;

          // Format the date nicely
          const dateObj = new Date(data.creationDate);
          document.getElementById('resDate').textContent = isNaN(
            dateObj.getTime()
          )
            ? data.creationDate
            : dateObj.toLocaleDateString('en-IN', {
                day: 'numeric',
                month: 'short',
                year: 'numeric',
              });

          document.getElementById('resAge').textContent =
            data.ageInDays !== 'Unknown'
              ? `${data.ageInDays} days old`
              : 'Unknown';

          const icon = document.getElementById('statusIcon');
          const title = document.getElementById('statusTitle');
          const subtitle = document.getElementById('statusSubtitle');

          if (data.isSuspicious) {
            resultBox.classList.add('border-rose-200', 'bg-rose-50/50');
            icon.textContent = 'warning';
            icon.className = 'material-symbols-outlined text-4xl text-rose-600';
            title.textContent = 'Suspiciously New Domain';
            title.className = 'text-2xl font-bold text-rose-900';
            subtitle.textContent =
              'This website was created very recently (less than 30 days ago). Scammers frequently register new domains for hit-and-run phishing attacks. Do not trust it with your details.';
            subtitle.className = 'text-sm leading-relaxed text-rose-700';
          } else {
            resultBox.classList.add('border-emerald-200', 'bg-emerald-50/50');
            icon.textContent = 'check_circle';
            icon.className =
              'material-symbols-outlined text-4xl text-emerald-600';
            title.textContent = 'Established Domain';
            title.className = 'text-2xl font-bold text-emerald-900';
            subtitle.textContent =
              'This website has been registered for a while, which lowers the risk of it being a brand new scam site. However, always remain cautious.';
            subtitle.className = 'text-sm leading-relaxed text-emerald-700';
          }
        } catch (err) {
          loadingBox.classList.add('hidden');
          alert(
            'Error connecting to server. Make sure your backend is running.'
          );
        }
      });
    </script>
  </body>
</html>
